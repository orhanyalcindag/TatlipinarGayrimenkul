<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <!-- Luxury Gold Linear Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E29D" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3C64C" />
      <stop offset="75%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#E5C158" />
    </linearGradient>

    <!-- Dark Metal Gradient -->
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2F3B" />
      <stop offset="100%" stop-color="#141820" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem Group -->
  <g transform="translate(15, 10)">
    <!-- Outer Octagon/Diamond Shield -->
    <polygon points="50,2 96,26 96,74 50,98 4,74 4,26" fill="url(#darkGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <polygon points="50,7 90,29 90,71 50,93 10,71 10,29" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3,2" opacity="0.6" />

    <!-- Architectural Monogram (T & P / Modern Roof & Key) -->
    <!-- Roof Gable -->
    <path d="M 24,42 L 50,18 L 76,42" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Chimney / Pillar Accent -->
    <line x1="66" y1="26" x2="66" y2="34" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Central Monogram T -->
    <line x1="34" y1="48" x2="66" y2="48" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <line x1="50" y1="48" x2="50" y2="84" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Stylized Monogram P Loop (Intertwined) -->
    <path d="M 50,48 Q 72,48 72,62 Q 72,74 50,74" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />

    <!-- Foundation Stones / Baseline -->
    <line x1="28" y1="84" x2="72" y2="84" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <circle cx="50" cy="88" r="2" fill="url(#goldGrad)" />
  </g>

  <!-- Typography Group -->
  <g transform="translate(130, 28)">
    <!-- Main Brand Name: TATLIPINAR -->
    <text x="0" y="32" font-family="'Cinzel', 'Playfair Display', 'Trajan Pro', 'Cinzel Decorative', 'Georgia', serif" font-size="34" font-weight="800" letter-spacing="4" fill="url(#goldGrad)">
      TATLIPINAR
    </text>

    <!-- Subtitle: GAYRİMENKUL -->
    <text x="3" y="56" font-family="'Plus Jakarta Sans', 'Montserrat', 'Inter', sans-serif" font-size="14.5" font-weight="600" letter-spacing="9" fill="#E2E8F0">
      GAYRİMENKUL
    </text>

    <!-- Gold Accent Line with Diamond -->
    <line x1="2" y1="67" x2="180" y2="67" stroke="url(#goldGrad)" stroke-width="1" opacity="0.7" />
    <polygon points="186,67 189,64 192,67 189,70" fill="url(#goldGrad)" />
    <line x1="198" y1="67" x2="375" y2="67" stroke="url(#goldGrad)" stroke-width="1" opacity="0.7" />

    <!-- Corporate Badges / Location -->
    <text x="3" y="80" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="10" font-weight="500" letter-spacing="2.5" fill="#94A3B8">
      LÜLEBURGAZ <tspan fill="url(#goldGrad)">•</tspan> YETKİ NO: 3900628 (EİDS ONAYLI)
    </text>
  </g>
</svg>
